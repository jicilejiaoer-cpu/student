<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f7f5">
    <meta name="description" content="赵庆，云南大学人工智能专业硕士研究生。记录计算机视觉与大模型学习计划。">
    <title>赵庆 · 个人主页</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #202420;
        --muted: #6b716b;
        --accent: #59735f;
        --line: #e5e8e2;
        --paper: #fff;
        --background: #f7f7f5;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--background);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      a { color: inherit; }

      .topbar {
        width: min(100% - 48px, 1000px);
        margin: 0 auto;
        padding: 28px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--muted);
        font-size: 13px;
        letter-spacing: .04em;
      }

      .topbar strong {
        color: var(--ink);
        font-size: 14px;
        font-weight: 650;
        letter-spacing: .02em;
      }

      main {
        width: min(100% - 48px, 1000px);
        margin: 0 auto;
        padding: 36px 0 72px;
      }

      .profile {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 220px;
        gap: clamp(32px, 7vw, 80px);
        align-items: center;
        padding: clamp(32px, 7vw, 76px);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 18px 50px rgb(27 37 28 / 4%);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 22px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: .12em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 22px;
        height: 1px;
        background: currentColor;
        content: "";
      }

      h1 {
        margin: 0;
        font-size: clamp(42px, 7vw, 64px);
        font-weight: 650;
        letter-spacing: .04em;
        line-height: 1.12;
      }

      .role {
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.8;
      }

      .intro {
        max-width: 440px;
        margin: 30px 0 0;
        color: #444b45;
        font-size: 15px;
        line-height: 1.9;
      }

      .contact {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 34px;
        padding: 12px 17px;
        border: 1px solid #dce3dc;
        border-radius: 999px;
        color: var(--accent);
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: background .18s ease, border-color .18s ease;
      }

      .contact:hover {
        border-color: #c5d2c6;
        background: #f5f8f4;
      }

      .contact svg { width: 16px; height: 16px; }

      .portrait-wrap {
        position: relative;
        justify-self: end;
        width: 100%;
        max-width: 220px;
      }

      .portrait-wrap::after {
        position: absolute;
        z-index: 0;
        inset: 14px -14px -14px 14px;
        border: 1px solid #dce3dc;
        border-radius: 14px;
        content: "";
      }

      .portrait {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        height: auto;
        border-radius: 12px;
        background: #f0f1ee;
      }

      .learning {
        margin-top: 24px;
        padding: clamp(32px, 6vw, 64px);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 18px 50px rgb(27 37 28 / 4%);
      }

      .learning h2 {
        margin: 0;
        font-size: clamp(28px, 4vw, 36px);
        font-weight: 650;
        letter-spacing: .02em;
      }

      .learning-note {
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.8;
      }

      .learning-group {
        margin-top: 34px;
      }

      .learning-group + .learning-group {
        padding-top: 30px;
        border-top: 1px solid var(--line);
      }

      .learning-group h3 {
        margin: 0 0 12px;
        font-size: 17px;
        font-weight: 650;
      }

      .checklist {
        margin: 0;
        padding-left: 1.7em;
      }

      .checklist li {
        padding: 11px 0;
        line-height: 1.7;
      }

      .checklist li + li {
        border-top: 1px solid var(--line);
      }

      .checklist li::marker {
        color: #87998a;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      .checklist label {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        color: var(--ink);
        cursor: default;
      }

      .checklist input {
        flex: none;
        width: 16px;
        height: 16px;
        margin: 5px 0 0;
        accent-color: var(--accent);
        opacity: 1;
      }

      .checklist input:checked + span {
        color: var(--muted);
        text-decoration: line-through;
        text-decoration-color: #aab6aa;
      }

      footer {
        width: min(100% - 48px, 1000px);
        margin: 0 auto;
        padding: 0 0 26px;
        color: #858b84;
        font-size: 12px;
        text-align: center;
      }

      @media (max-width: 680px) {
        .topbar { width: min(100% - 36px, 1000px); padding: 21px 0; }
        main { width: min(100% - 36px, 1000px); padding: 30px 0 48px; }
        .profile { grid-template-columns: 1fr; gap: 38px; padding: 34px 28px 42px; }
        .portrait-wrap { grid-row: 1; justify-self: start; width: 144px; }
        .portrait-wrap::after { inset: 9px -9px -9px 9px; }
        .eyebrow { margin-bottom: 16px; }
        .role { margin-top: 12px; font-size: 15px; }
        .intro { margin-top: 22px; font-size: 14px; }
        .contact { margin-top: 25px; }
        .learning { padding: 34px 28px 42px; }
        .learning-group { margin-top: 28px; }
        .learning-group + .learning-group { padding-top: 26px; }
        footer { width: min(100% - 36px, 1000px); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <strong>赵庆</strong>
      <span>个人主页</span>
    </header>

    <main>
      <section class="profile" aria-labelledby="name">
        <div class="intro-copy">
          <p class="eyebrow">About me</p>
          <h1 id="name">赵庆</h1>
          <p class="role">云南大学 · 人工智能专业<br>硕士研究生</p>
          <p class="intro">计划学习计算机视觉与大模型相关技术，在这里记录学习进度。</p>
          <a class="contact" href="mailto:2992110786@qq.com" aria-label="发送邮件至 2992110786@qq.com">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 6.75h16v10.5H4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="m5 8 7 5 7-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            联系我
          </a>
        </div>
        <div class="portrait-wrap">
          <img class="portrait" src="portrait.jpg" alt="赵庆证件照" width="960" height="1338">
        </div>
      </section>

      <section class="learning" aria-labelledby="learning-title">
        <p class="eyebrow">Learning plan</p>
        <h2 id="learning-title">学习清单</h2>
        <p class="learning-note">先学习基础，再分别推进计算机视觉和大模型方向。未勾选代表尚未学会。</p>

        <!-- 完成某项后，在对应的 input 中加入 checked，例如：<input type="checkbox" checked disabled> -->
        <div class="learning-group">
          <h3>基础</h3>
          <ol class="checklist">
            <li><label><input type="checkbox" checked disabled><span>Python 基础</span></label></li>
            <li><label><input type="checkbox" disabled><span>数学、机器学习与深度学习基础</span></label></li>
            <li><label><input type="checkbox" disabled><span>PyTorch：张量、自动求导与训练流程</span></label></li>
          </ol>
        </div>

        <div class="learning-group">
          <h3>计算机视觉方向</h3>
          <ol class="checklist">
            <li><label><input type="checkbox" disabled><span>图像处理与卷积神经网络（CNN）</span></label></li>
            <li><label><input type="checkbox" disabled><span>图像分类、目标检测与图像分割</span></label></li>
          </ol>
        </div>

        <div class="learning-group">
          <h3>大模型方向 · 推荐顺序</h3>
          <ol class="checklist">
            <li><label><input type="checkbox" disabled><span>Transformer 与 Tokenizer</span></label></li>
            <li><label><input type="checkbox" disabled><span>大模型调用与推理</span></label></li>
            <li><label><input type="checkbox" disabled><span>提示词工程</span></label></li>
            <li><label><input type="checkbox" disabled><span>RAG：检索增强生成</span></label></li>
            <li><label><input type="checkbox" disabled><span>LangChain</span></label></li>
            <li><label><input type="checkbox" disabled><span>Agent 基础</span></label></li>
            <li><label><input type="checkbox" disabled><span>LangGraph</span></label></li>
            <li><label><input type="checkbox" disabled><span>多 Agent 系统</span></label></li>
            <li><label><input type="checkbox" disabled><span>模型微调（LoRA 等）</span></label></li>
            <li><label><input type="checkbox" disabled><span>模型量化</span></label></li>
            <li><label><input type="checkbox" disabled><span>私有化部署</span></label></li>
            <li><label><input type="checkbox" disabled><span>多模态模型</span></label></li>
          </ol>
        </div>

        <div class="learning-group">
          <h3>其他目标</h3>
          <ol class="checklist">
            <li><label><input type="checkbox" disabled><span>英语六级（待通过）</span></label></li>
          </ol>
        </div>
      </section>
    </main>

    <footer>© 2026 赵庆</footer>
  </body>
</html>
