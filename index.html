<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f7f5">
    <meta name="description" content="赵庆，云南大学硕士研究生。">
    <title>赵庆 · 个人主页</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #202420;
        --muted: #6b716b;
        --accent: #59735f;
        --line: #e5e8e2;
        --paper: #fff;
        --background: #f7f7f5;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--background);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      a { color: inherit; }

      .topbar {
        width: min(100% - 48px, 1000px);
        margin: 0 auto;
        padding: 28px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--muted);
        font-size: 13px;
        letter-spacing: .04em;
      }

      .topbar strong {
        color: var(--ink);
        font-size: 14px;
        font-weight: 650;
        letter-spacing: .02em;
      }

      main {
        width: min(100% - 48px, 1000px);
        margin: auto;
        padding: 52px 0 72px;
      }

      .profile {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 220px;
        gap: clamp(32px, 7vw, 80px);
        align-items: center;
        padding: clamp(32px, 7vw, 76px);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 18px 50px rgb(27 37 28 / 4%);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 22px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: .12em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 22px;
        height: 1px;
        background: currentColor;
        content: "";
      }

      h1 {
        margin: 0;
        font-size: clamp(42px, 7vw, 64px);
        font-weight: 650;
        letter-spacing: .04em;
        line-height: 1.12;
      }

      .role {
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.8;
      }

      .intro {
        max-width: 440px;
        margin: 30px 0 0;
        color: #444b45;
        font-size: 15px;
        line-height: 1.9;
      }

      .contact {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 34px;
        padding: 12px 17px;
        border: 1px solid #dce3dc;
        border-radius: 999px;
        color: var(--accent);
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: background .18s ease, border-color .18s ease;
      }

      .contact:hover {
        border-color: #c5d2c6;
        background: #f5f8f4;
      }

      .contact svg { width: 16px; height: 16px; }

      .portrait-wrap {
        position: relative;
        justify-self: end;
        width: 100%;
        max-width: 220px;
      }

      .portrait-wrap::after {
        position: absolute;
        z-index: 0;
        inset: 14px -14px -14px 14px;
        border: 1px solid #dce3dc;
        border-radius: 14px;
        content: "";
      }

      .portrait {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        height: auto;
        border-radius: 12px;
        background: #f0f1ee;
      }

      footer {
        width: min(100% - 48px, 1000px);
        margin: 0 auto;
        padding: 0 0 26px;
        color: #858b84;
        font-size: 12px;
        text-align: center;
      }

      @media (max-width: 680px) {
        .topbar { width: min(100% - 36px, 1000px); padding: 21px 0; }
        main { width: min(100% - 36px, 1000px); padding: 30px 0 48px; }
        .profile { grid-template-columns: 1fr; gap: 38px; padding: 34px 28px 42px; }
        .portrait-wrap { grid-row: 1; justify-self: start; width: 144px; }
        .portrait-wrap::after { inset: 9px -9px -9px 9px; }
        .eyebrow { margin-bottom: 16px; }
        .role { margin-top: 12px; font-size: 15px; }
        .intro { margin-top: 22px; font-size: 14px; }
        .contact { margin-top: 25px; }
        footer { width: min(100% - 36px, 1000px); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <strong>赵庆</strong>
      <span>个人主页</span>
    </header>

    <main>
      <section class="profile" aria-labelledby="name">
        <div class="intro-copy">
          <p class="eyebrow">About me</p>
          <h1 id="name">赵庆</h1>
          <p class="role">硕士研究生<br>云南大学</p>
          <p class="intro">你好，欢迎来到我的个人主页。</p>
          <a class="contact" href="mailto:2992110786@qq.com" aria-label="发送邮件至 2992110786@qq.com">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 6.75h16v10.5H4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="m5 8 7 5 7-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            联系我
          </a>
        </div>
        <div class="portrait-wrap">
          <img class="portrait" src="portrait.jpg" alt="赵庆证件照" width="960" height="1338">
        </div>
      </section>
    </main>

    <footer>© 2026 赵庆</footer>
  </body>
</html>
